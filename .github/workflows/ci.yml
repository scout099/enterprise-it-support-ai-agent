name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IT_SUPPORT_DATABASE_URL: postgresql+psycopg://it_support:ci-only-password@localhost:5432/enterprise_it_support
  IT_SUPPORT_TEST_DATABASE_URL: postgresql+psycopg://it_support:ci-only-password@localhost:5432/enterprise_it_support_test
  IT_SUPPORT_EMBEDDING_PROVIDER: fake
  IT_SUPPORT_EMBEDDING_MODEL: fake-embedding-v1
  IT_SUPPORT_EMBEDDING_DIMENSION: "8"
  IT_SUPPORT_EMBEDDING_VERSION: v1
  IT_SUPPORT_MODEL_PROVIDER: fake
  IT_SUPPORT_MODEL_NAME: fake-chat-v1

jobs:
  quality:
    name: Ruff and package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install project
        run: python -m pip install '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Compile Python
        run: python -m compileall -q apps src scripts migrations tests
      - name: Check dependencies
        run: python -m pip check
      - name: Check repository security boundaries
        run: python -m scripts.check_security_boundaries

  dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install pinned audit tool
        run: python -m pip install pip-audit==2.10.1
      - name: Audit resolved project dependencies
        run: python -m pip_audit . --strict

  tests:
    name: pytest with PostgreSQL and pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
        env:
          POSTGRES_USER: it_support
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: enterprise_it_support
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U it_support -d enterprise_it_support"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Create isolated test database
        run: docker exec ${{ job.services.postgres.id }} createdb -U it_support enterprise_it_support_test
      - name: Install project
        run: python -m pip install '.[dev]'
      - name: Run test suite
        run: python -m pytest -q

  migrations:
    name: Migration safety and drift
    runs-on: ubuntu-latest
    env:
      IT_SUPPORT_ENVIRONMENT: test
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
        env:
          POSTGRES_USER: it_support
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: enterprise_it_support
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U it_support -d enterprise_it_support"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Create isolated test database
        run: docker exec ${{ job.services.postgres.id }} createdb -U it_support enterprise_it_support_test
      - name: Install project
        run: python -m pip install '.[dev]'
      - name: Upgrade to the single migration head
        run: python -m scripts.run_migrations
      - name: Prove repeated automatic migration is a no-op
        run: python -m scripts.run_migrations
      - name: Check ORM and migration drift
        run: alembic check

  evaluation:
    name: Evaluation regression
    runs-on: ubuntu-latest
    env:
      IT_SUPPORT_ENVIRONMENT: test
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
        env:
          POSTGRES_USER: it_support
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: enterprise_it_support
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U it_support -d enterprise_it_support"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Create isolated test database
        run: docker exec ${{ job.services.postgres.id }} createdb -U it_support enterprise_it_support_test
      - name: Install project
        run: python -m pip install '.[dev]'
      - name: Migrate evaluation database
        run: python -m scripts.run_migrations
      - name: Run deterministic 30-case evaluation gate
        run: python -m scripts.run_evaluations

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download and verify Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan Git history and worktree
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --no-banner --redact
          "$RUNNER_TEMP/gitleaks" dir . --config .gitleaks.toml --no-banner --redact

  docker:
    name: Docker build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fastapi
            dockerfile: docker/Dockerfile.api
          - name: streamlit
            dockerfile: docker/Dockerfile.streamlit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: enterprise-it-support-${{ matrix.name }}:ci
