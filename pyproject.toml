[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-it-support-agent"
version = "0.1.0"
description = "Enterprise IT Support AI Agent MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi>=0.115,<1",
    "openai>=2,<3",
    "pgvector>=0.3,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "pypdf>=5,<7",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "reportlab>=4,<5",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
    "integration: requires the PostgreSQL test database",
]

[tool.ruff]
line-length = 100
src = ["apps", "src", "tests", "migrations"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
